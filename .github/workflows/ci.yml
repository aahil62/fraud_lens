name: Verify FraudLens

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRAUDLENS_SEED_DEMO: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check formatting and lint
        run: |
          .venv/bin/ruff check fraudlens scripts tests
          .venv/bin/ruff format --check fraudlens scripts tests
          npm --prefix frontend run format:check
      - name: Verify operational backend and frontend
        run: .venv/bin/python scripts/check.py
