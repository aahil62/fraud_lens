:root { --g-950: #151513; --g-900: #201f1c; --g-850: #2a2925; --g-700: #3c3a35; --on-dark: #f1efe9; --on-dark-muted: #a9a69c;
  --stone: #e9e8e3; --surface: #f7f6f3; --line: #d8d6ce; --ink: #1d1c19; --muted: #5c5a53;
  --brass: #c39a4a; --brass-ink: #1a1712; --brass-text: #7a5717; --brass-on-dark: #d2a756;
  --risk: #a3362e; --frozen: #4d5d62; --held: #2c6a47; --body: "Mona Sans", system-ui, sans-serif; --mono: "Courier Prime", ui-monospace, monospace; }
* { box-sizing: border-box; margin: 0; }
body { background: #0f0f0e; color: var(--on-dark); font: 400 14px/1.55 var(--body); padding: 40px 16px 64px; }
.page { max-width: 1600px; margin: 0 auto; }
.page > header { max-width: 760px; margin-bottom: 32px; }
.page > header h1 { font: 700 26px/1.2 var(--body); }
.page > header p { color: var(--on-dark-muted); margin-top: 8px; }
.concepts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 1100px) { .concepts { grid-template-columns: minmax(0, 1fr); } }
.c { display: grid; gap: 12px; align-content: start; }
.c > h2 { font: 650 16px/1.3 var(--body); }
.c > p { color: var(--on-dark-muted); font-size: 13px; min-height: 3.2em; }
.hero { background: var(--g-950); border: 1px solid #ffffff14; border-radius: 14px; padding: 22px; min-height: 230px; display: grid; align-content: space-between; gap: 16px; background-image: radial-gradient(120% 90% at 90% 0%, #c39a4a26, transparent 60%); }
.hero .lead { color: var(--on-dark-muted); font-size: 13px; max-width: 30ch; }
.btn { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; background: var(--brass); color: var(--brass-ink); font: 600 12px/1 var(--body); white-space: nowrap; justify-self: start; }
.card { background: var(--stone); color: var(--ink); border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
.card .sheet { background: var(--surface); border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
.card .meta { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
.id { font: 400 13px/1.3 var(--mono); color: var(--muted); }
.amt { font: 700 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.score { font: 700 22px/1 var(--mono); color: var(--risk); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 22px; padding: 0 8px; border-radius: 4px; display: inline-flex; align-items: center; font: 600 11px/1 var(--body); color: #fff; }
.chip.frozen { background: var(--frozen); } .chip.held { background: var(--held); } .chip.pending { color: var(--ink); background: none; border: 1px dashed var(--muted); }
.card p { color: var(--muted); font-size: 13px; }
.attack { background: var(--g-950); border: 1px solid #ffffff14; border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
.attack .scam { background: var(--g-850); border-radius: 10px; padding: 10px 12px; box-shadow: inset 3px 0 0 var(--brass-on-dark); font-size: 12px; color: var(--on-dark-muted); }
.attack .scam b { display: block; color: var(--on-dark); font: 650 13px/1.3 var(--body); }
/* Display treatments */
.panchang .d { font-family: "Panchang"; font-weight: 800; letter-spacing: -0.01em; }
.panchang .hero .d { font-size: 40px; line-height: 1; }
.panchang .card .d { font-size: 17px; line-height: 1.2; font-weight: 700; }
.panchang .attack .d { font-size: 22px; line-height: 1.05; }
.erode .d { font-family: "Erode"; font-weight: 700; letter-spacing: -0.015em; }
.erode .hero .d { font-size: 56px; line-height: 0.98; }
.erode .card .d { font-size: 22px; line-height: 1.15; }
.erode .attack .d { font-size: 30px; line-height: 1.02; }
.tanker .d { font-family: "Tanker"; font-weight: 400; text-transform: uppercase; letter-spacing: 0.005em; }
.tanker .hero .d { font-size: 72px; line-height: 0.9; }
.tanker .card .d { font-size: 26px; line-height: 1; }
.tanker .attack .d { font-size: 38px; line-height: 0.95; }

<body>
<main class="page">
  <header>
    <h1>FraudLens type concepts, graphite + brass</h1>
    <p>Each concept changes only the display face (headlines and page titles). Body text stays Mona Sans for long reading; IDs, amounts and scores use Courier Prime, a typewriter face like an old bank ledger.</p>
  </header>
  <div class="concepts" id="concepts"></div>
</main>
<template id="t">
  <section class="c">
    <h2 data-name></h2><p data-mood></p>
    <div class="hero"><h3 class="d">Follow the signal.</h3><div><p class="lead">From a suspicious payment to a decision you can explain.</p><br><span class="btn">Open the operations centre ↗</span></div></div>
    <div class="card"><h3 class="d">SIM-swap account takeover</h3><span class="id">CASE-0D4E573825B3</span>
      <div class="sheet"><div class="meta"><span class="amt">₹80,000.00</span><span class="score">95.0</span></div><div class="chips"><span class="chip frozen">Restrict confirmed</span><span class="chip pending">Lien pending</span><span class="chip held">Held</span></div><p>Repeated authentication failures, then a large transfer to a new beneficiary from a new device.</p></div></div>
    <div class="attack"><h3 class="d">Launch a scam. Watch the bank react.</h3><div class="scam"><b>Mule layering</b>A victim is tricked into a UPI payment; the money hops through mule accounts.</div><span class="amt" style="color:var(--on-dark)">₹48,000</span></div>
  </section>
</template>
<script>
[["panchang", "A. Panchang: vault plaque", "Very wide, heavy 1970s–80s bank-signage capitals feel. Loudest on the landing; works for short titles only."],
 ["erode", "B. Erode: 1970s annual report", "A chunky, soft-edged serif with ink-trap warmth. Reads like a printed bank report; the most readable of the three at console sizes."],
 ["tanker", "C. Tanker: teller-window poster", "Condensed all-caps poster type, like old cinema or bank-queue signage. Most dramatic; needs short headlines."]]
.forEach(([cls, name, mood]) => {
  const n = document.getElementById("t").content.cloneNode(true);
  n.querySelector(".c").classList.add(cls);
  n.querySelector("[data-name]").textContent = name;
  n.querySelector("[data-mood]").textContent = mood;
  document.getElementById("concepts").appendChild(n);
});
</script>
</body>
